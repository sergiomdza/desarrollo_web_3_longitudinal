# Módulo de Notificaciones (Equipo #6).
# Requiere el namespace proyecto-final y kubernetes/mongo_statefulset.yaml
# (de ahí se reutilizan mongo-service y las credenciales de mongo-secret).
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: proyecto-final
  name: notifications-config
data:
  MONGO_HOST: mongo-service.proyecto-final.svc.cluster.local
  MONGO_PORT: "27017"
  MONGO_AUTH_SOURCE: admin
  MONGO_DB: proyecto_final
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: proyecto-final
  name: notifications-api
  labels:
    app: notifications-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notifications-api
  template:
    metadata:
      labels:
        app: notifications-api
    spec:
      containers:
        - name: notifications-api
          # Imagen publicada por .github/workflows/cicd_equipo_6_notifications.yaml.
          # IfNotPresent permite usar la misma etiqueta cargada con `kind load`.
          image: ghcr.io/sergiomdza/desarrollo_web_3_longitudinal-notifications:equipo_6-latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: notifications-config
          env:
            - name: MONGO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: MONGO_INITDB_ROOT_USERNAME
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: MONGO_INITDB_ROOT_PASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  namespace: proyecto-final
  name: notifications-service
spec:
  selector:
    app: notifications-api
  ports:
    - name: http
      port: 8000
      targetPort: http
  type: ClusterIP
