apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: proyecto-final
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: alloy-logs
  namespace: proyecto-final
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alloy-logs
  namespace: proyecto-final
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: proyecto-final
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: alloy-logs
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: proyecto-final
data:
  config.alloy: |
    // 1. Descubre pods vía la API de Kubernetes (requiere el RBAC alloy-logs).
    discovery.kubernetes "backend" {
      role = "pod"

      // Solo busca en el namespace proyecto-final.
      namespaces {
        names = ["proyecto-final"]
      }

      // Filtra por label: solo los pods del servicio de solicitudes.
      selectors {
        role  = "pod"
        label = "app in (requests-backend)"
      }
    }

    // 2. Convierte metadatos internos (__meta_*) en labels visibles en Loki.
    // Los __meta_* se descartan si no se copian aquí.
    discovery.relabel "backend_logs" {
      targets = discovery.kubernetes.backend.targets

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        target_label  = "app"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
    }

    // 3. Lee los logs de cada pod (vía API de Kubernetes) y los manda a loki.write.
    loki.source.kubernetes "backend" {
      targets    = discovery.relabel.backend_logs.output
      forward_to = [loki.write.local.receiver]
    }

    // 4. Envía los logs al endpoint de push de Loki (desplegado en default por logging.yaml).
    loki.write "local" {
      endpoint {
        url = "http://loki-service.default.svc.cluster.local:3100/loki/api/v1/push"
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  namespace: proyecto-final
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: alloy
  template:
    metadata:
      labels:
        app: alloy
    spec:
      serviceAccountName: alloy
      containers:
        - name: alloy
          image: grafana/alloy:v1.21.0
          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/var/lib/alloy
            - --disable-reporting
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
              readOnly: true
            - name: data
              mountPath: /var/lib/alloy
      volumes:
        - name: config
          configMap:
            name: alloy-config
        - name: data
          emptyDir: {}
