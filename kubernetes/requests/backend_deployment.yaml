apiVersion: apps/v1
kind: Deployment
metadata:
  name: requests-backend
  namespace: proyecto-final
  labels:
    app: requests-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: requests-backend
  template:
    metadata:
      labels:
        app: requests-backend

    spec:
      containers:
        - name: requests-backend
          image: ghcr.io/sergiomdza/desarrollo_web_3_longitudinal-requests:equipo_4_p2-latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000

          env:
            - name: MONGO_USER
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: MONGO_INITDB_ROOT_USERNAME

            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: MONGO_INITDB_ROOT_PASSWORD

            - name: MONGO_HOST
              value: mongo-service

            - name: MONGO_PORT
              value: "27017"

            - name: MONGO_DB
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: MONGO_DB_NAME

            - name: SERVICE_NAME
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: SERVICE_NAME

            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: LOG_LEVEL

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: requests-service
  namespace: proyecto-final
spec:
  selector:
    app: requests-backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP