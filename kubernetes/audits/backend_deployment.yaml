apiVersion: v1
kind: ConfigMap
metadata:
  name: audits-config
  namespace: proyecto-final
data:
  MONGO_DB: DB_Proyecto
  MONGO_COLLECTION: auditorias
---
apiVersion: v1
kind: Secret
metadata:
  name: audits-database-secret
  namespace: proyecto-final
type: Opaque
stringData:
  MONGO_URI: mongodb://admin:web3@mongo-service.proyecto-final.svc.cluster.local:27017/?authSource=admin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audits-api
  namespace: proyecto-final
  labels:
    app: audits-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: audits-api
  template:
    metadata:
      labels:
        app: audits-api
    spec:
      containers:
        - name: audits-api
          # Imagen publicada por .github/workflows/cicd_equipo_1_audits.yaml
          image: ghcr.io/sergiomdza/desarrollo_web_3_longitudinal-audits:equipo_1-latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8001
          envFrom:
            - configMapRef:
                name: audits-config
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: audits-database-secret
                  key: MONGO_URI
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: audits-service
  namespace: proyecto-final
spec:
  selector:
    app: audits-api
  ports:
    - name: http
      port: 8001
      targetPort: http
  type: ClusterIP