apiVersion: apps/v1
kind: Deployment
metadata:
  name: notificaciones
  namespace: proyecto-final
  labels:
    app: notifications-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notifications-backend
  template:
    metadata:
      labels:
        # Proyecto 2: label app que esperan Alloy (logs) y Prometheus (métricas)
        # en kubernetes/logging.yaml y kubernetes/monitoring_tools.yaml.
        app: notifications-backend
    spec:
      containers:
        - name: notificaciones
          image: ghcr.io/sergiomdza/notificaciones:latest
          # IfNotPresent: si la imagen se cargó con `kind load`, se usa esa.
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8000

          envFrom:
            - configMapRef:
                name: notifications-config
            - secretRef:
                name: notifications-secret

          env:
            # Proyecto 2: cada log JSON indica de qué réplica salió.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
