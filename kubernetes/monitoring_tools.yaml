apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: proyecto-final
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
            - name: prometheus-data
              mountPath: /prometheus

      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
        - name: prometheus-data
          persistentVolumeClaim:
            claimName: prometheus-data

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: proyecto-final
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: proyecto-final
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      # Categorías & Ubicaciones (products): un target por réplica vía Service headless
      # (kubernetes/products/observabilidad/metrics_service.yaml).
      - job_name: categorias-ubicaciones
        metrics_path: /metrics
        dns_sd_configs:
          - names:
              - categorias-ubicaciones-metrics.proyecto-final.svc.cluster.local
            type: A
            port: 8000
            refresh_interval: 15s
        relabel_configs:
          - target_label: app
            replacement: categorias-ubicaciones

      - job_name: usuarios
        metrics_path: /metrics
        static_configs:
          - targets:
            - users-service.proyecto-final.svc.cluster.local:8000
            labels:
              app:  users-backend

      - job_name: solicitudes
        metrics_path: /metrics
        scrape_interval: 15s
        static_configs:
          - targets:
            - requests-service.proyecto-final.svc.cluster.local:8000
            labels:
              app: requests-backend

      - job_name: reportes
        metrics_path: /metrics
        static_configs:
          - targets:
            - reportes-service.proyecto-final.svc.cluster.local:8000

      - job_name: auditorias
        metrics_path: /metrics
        dns_sd_configs:
          - names:
              - audits-metrics.proyecto-final.svc.cluster.local
            type: A
            port: 8001
            refresh_interval: 15s
        relabel_configs:
          - target_label: app
            replacement: audits-api

      - job_name: notificaciones
        metrics_path: /metrics
        dns_sd_configs:
          - names:
              - notificaciones-metrics.proyecto-final.svc.cluster.local
            type: A
            port: 8000
            refresh_interval: 15s
        relabel_configs:
          - target_label: app
            replacement: notifications-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: proyecto-final
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:12.1.1
          imagePullPolicy: IfNotPresent
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-secret
                  key: GRAFANA_USERNAME
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-secret
                  key: GRAFANA_PASSWORD
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: data
              mountPath: /var/lib/grafana
      volumes:
        - name: datasources
          configMap:
            name: grafana-config
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  namespace: proyecto-final
spec:
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: proyecto-final
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-service.proyecto-final.svc.cluster.local:9090
        isDefault: true
        editable: false
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki-service.proyecto-final.svc.cluster.local:3100
        isDefault: false
        editable: false
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-secret
  namespace: proyecto-final
type: Opaque
stringData:
  GRAFANA_USERNAME: grafana_admin
  GRAFANA_PASSWORD: web3
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: proyecto-final
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: proyecto-final
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
