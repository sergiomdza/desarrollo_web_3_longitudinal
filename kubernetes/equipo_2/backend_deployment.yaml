# Usa la imagen que publica el pipeline en GHCR (linux/amd64 y linux/arm64).
# imagePullPolicy: Always -> cada pod nuevo jala el `latest` más reciente.
# Tras cada push a equipo_2, cuando termine el workflow, corran:
#   kubectl rollout restart deployment/categorias-ubicaciones-api -n proyecto-final
apiVersion: apps/v1
kind: Deployment
metadata:
  name: categorias-ubicaciones-api
  namespace: proyecto-final
  labels:
    app: categorias-ubicaciones
spec:
  replicas: 2
  selector:
    matchLabels:
      app: categorias-ubicaciones
  template:
    metadata:
      labels:
        app: categorias-ubicaciones
    spec:
      containers:
        - name: categorias-ubicaciones
          image: ghcr.io/sergiomdza/categorias-ubicaciones:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: categorias-ubicaciones-config
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: categorias-ubicaciones-secret
                  key: MONGO_URI
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: categorias-ubicaciones-service
  namespace: proyecto-final
spec:
  selector:
    app: categorias-ubicaciones
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
