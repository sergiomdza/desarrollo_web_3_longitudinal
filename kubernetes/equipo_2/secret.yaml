# Cadena de conexión del backend al Mongo común (kubernetes/mongo_statefulset.yaml).
# Usa las mismas credenciales que el Secret "mongo-secret" de ese archivo.
apiVersion: v1
kind: Secret
metadata:
  name: categorias-ubicaciones-secret
  namespace: proyecto-final
type: Opaque
stringData:
  MONGO_URI: mongodb://admin:web3@mongo-service.proyecto-final.svc.cluster.local:27017/?authSource=admin
