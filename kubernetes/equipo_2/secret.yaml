# Credenciales de Mongo, compartidas entre el StatefulSet (usuario root) y el
# backend (cadena de conexión completa). Mismos valores que usa
# backend/products/docker-compose.yaml para mantener consistencia local <-> k8s.
apiVersion: v1
kind: Secret
metadata:
  name: mongo-secret
  namespace: equipo-2
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: admin
  MONGO_INITDB_ROOT_PASSWORD: web3
  MONGO_URI: mongodb://admin:web3@mongo-service.equipo-2.svc.cluster.local:27017/?authSource=admin
