# Configuración no sensible del backend. Mismos valores que
# backend/products/docker-compose.yaml. La base "equipo_2" separa nuestras
# colecciones de las de otros equipos dentro del Mongo común.
apiVersion: v1
kind: ConfigMap
metadata:
  name: categorias-ubicaciones-config
  namespace: proyecto-final
data:
  MONGO_DB_NAME: equipo_2
  CATEGORIAS_COLLECTION: categorias
  UBICACIONES_COLLECTION: ubicaciones
  ACTIVOS_COLLECTION: activos
