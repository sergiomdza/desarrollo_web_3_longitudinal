# ConfigMap prometheus-config del stack de clase (namespace default).
#
# Es la configuración del profesor (kubernetes/monitoring_tools.yaml de main)
# SIN CAMBIOS, más un job nuevo al final: categorias-ubicaciones (Equipo 2).
# Si el profesor cambia sus jobs, cópienlos aquí antes de volver a aplicar.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: default
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: productos
        metrics_path: /metrics
        static_configs:
          - targets:
            - products-service.default.svc.cluster.local:8000

      - job_name: usuarios
        metrics_path: /metrics
        static_configs:
          - targets:
            - users-service.default.svc.cluster.local:8000

      - job_name: solicitudes
        metrics_path: /metrics
        static_configs:
          - targets:
            - requests-service.default.svc.cluster.local:8000

      - job_name: reportes
        metrics_path: /metrics
        static_configs:
          - targets:
            - reports-service.default.svc.cluster.local:8000

      - job_name: auditorias
        metrics_path: /metrics
        static_configs:
          - targets:
            - audits-service.default.svc.cluster.local:8001

      - job_name: notificaciones
        metrics_path: /metrics
        static_configs:
          - targets:
            - notifications-service.default.svc.cluster.local:8000

      # --- Equipo 2: Categorías & Ubicaciones (namespace proyecto-final) ---
      # dns_sd_configs consulta el DNS del Service headless: devuelve un
      # registro A por pod, así que Prometheus ve 2 targets (uno por réplica).
      - job_name: categorias-ubicaciones
        metrics_path: /metrics
        dns_sd_configs:
          - names:
              - categorias-ubicaciones-metrics.proyecto-final.svc.cluster.local
            type: A
            port: 8000
            refresh_interval: 15s
        relabel_configs:
          - target_label: app
            replacement: categorias-ubicaciones
          - target_label: namespace
            replacement: proyecto-final
