name: Build & publish imagen Categorías & Ubicaciones

on:
  push:
    paths:
      - "backend/products/**"
      - ".github/workflows/categorias_ubicaciones_build_image.yaml"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Definir nombre de imagen en minúsculas
        id: image
        run: |
          # Nombre de rama válido para un tag (minúsculas, "/" y otros caracteres -> "-").
          BRANCH="$(echo "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')"
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-products" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # QEMU permite construir también linux/arm64 (Macs con Apple Silicon)
      - name: Configurar QEMU
        uses: docker/setup-qemu-action@v3

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: backend/products
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.branch }}-${{ github.run_number }}
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.branch }}-latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
