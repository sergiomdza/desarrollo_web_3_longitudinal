[project]
name = "equipo2-categorias-ubicaciones"
version = "0.1.0"
description = "Microservicio de Categorías & Ubicaciones (Equipo 2)"
authors = [
    {name = "DonPedroloDev",email = "AlexTBCG@gmail.com"}
]
requires-python = ">=3.9"
dependencies = [
    "fastapi (>=0.128.8,<0.129.0)",
    "uvicorn (>=0.39.0,<0.40.0)",
    "pymongo (>=4.18.2,<5.0.0)"
]

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
