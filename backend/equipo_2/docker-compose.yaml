services:
  mongo:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: web3
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  categorias-ubicaciones:
    build: .
    image: categorias-ubicaciones:local
    environment:
      MONGO_URI: mongodb://admin:web3@mongo:27017/?authSource=admin
      MONGO_DB_NAME: equipo_2
      CATEGORIAS_COLLECTION: categorias
      UBICACIONES_COLLECTION: ubicaciones
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
