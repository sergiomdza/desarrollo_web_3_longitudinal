[project]
name = "modulo-notificaciones"
version = "0.1.0"
description = "API REST del módulo de Notificaciones para el sistema de préstamos"
requires-python = ">=3.12,<3.14"

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pymongo>=4.13,<5.0",
    "pydantic>=2.10,<3.0"
]

[tool.poetry]
package-mode = false
requires-poetry = ">=2.4,<3.0"

[build-system]
requires = ["poetry-core>=2.4,<3.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
