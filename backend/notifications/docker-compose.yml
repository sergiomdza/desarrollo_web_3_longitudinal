# Entorno local: MongoDB (mismas credenciales que kubernetes/mongo_statefulset.yaml)
# y la API de notificaciones.
#   docker compose up --build
#   docker compose run --rm api python scripts/seeder.py
services:
  mongo:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: web3
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
      MONGO_USERNAME: admin
      MONGO_PASSWORD: web3
      MONGO_AUTH_SOURCE: admin
      MONGO_DB: proyecto_final
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
